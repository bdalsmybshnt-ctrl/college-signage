```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة تحكم الإعلانات</title>

<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


<style>

/* ============================= */
/* إعدادات عامة */
/* ============================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:Arial, sans-serif;

    background:

    linear-gradient(
    135deg,
    #0f2027,
    #203a43,
    #2c5364
    );

    min-height:100vh;

    color:white;

}


/* ============================= */
/* الهيدر */
/* ============================= */

header{

    background:

    rgba(0,0,0,0.4);

    padding:25px;

    text-align:center;

    box-shadow:

    0 5px 20px rgba(0,0,0,0.4);

}

header h1{

    font-size:30px;

}

header p{

    margin-top:10px;

    color:#ccc;

}


/* ============================= */
/* المحتوى */
/* ============================= */

.container{

    width:90%;

    max-width:1200px;

    margin:40px auto;

}


/* ============================= */
/* البطاقات */
/* ============================= */

.card{

    background:

    rgba(255,255,255,0.08);

    backdrop-filter:

    blur(10px);

    padding:30px;

    border-radius:15px;

    box-shadow:

    0 10px 30px rgba(0,0,0,0.4);

    margin-bottom:30px;

}


/* ============================= */
/* العناوين */
/* ============================= */

.card h2{

    margin-bottom:25px;

    border-bottom:

    1px solid rgba(255,255,255,0.2);

    padding-bottom:15px;

}


/* ============================= */
/* الحقول */
/* ============================= */

.form-group{

    margin-bottom:20px;

}


label{

    display:block;

    margin-bottom:8px;

    font-size:16px;

}


input,
textarea{

    width:100%;

    padding:14px;

    border:none;

    border-radius:8px;

    font-size:16px;

    outline:none;

}


textarea{

    min-height:120px;

    resize:vertical;

}


/* ============================= */
/* اختيار الألوان */
/* ============================= */

.colors{

    display:flex;

    gap:15px;

    flex-wrap:wrap;

}


.color-option{

    width:45px;

    height:45px;

    border-radius:50%;

    cursor:pointer;

    border:3px solid white;

}


.color-option:hover{

    transform:scale(1.1);

}


/* ============================= */
/* الأزرار */
/* ============================= */

.buttons{

    display:flex;

    gap:15px;

    flex-wrap:wrap;

    margin-top:20px;

}


button{

    border:none;

    padding:

    14px 25px;

    border-radius:8px;

    font-size:16px;

    cursor:pointer;

    transition:0.3s;

}


button:hover{

    transform:

    translateY(-3px);

}


.btn-preview{

    background:

    #3498db;

    color:white;

}


.btn-save{

    background:

    #27ae60;

    color:white;

}


.btn-delete{

    background:

    #e74c3c;

    color:white;

}


/* ============================= */
/* المعاينة */
/* ============================= */

.preview{

    margin-top:30px;

    min-height:350px;

    background:#111;

    border-radius:15px;

    overflow:hidden;

    display:flex;

    align-items:center;

    justify-content:center;

}


/* ============================= */
/* قائمة الإعلانات */
/* ============================= */

.slide-item{

    display:flex;

    justify-content:

    space-between;

    align-items:center;

    background:

    rgba(255,255,255,0.1);

    padding:15px;

    margin-bottom:10px;

    border-radius:8px;

}


.slide-item button{

    padding:

    8px 15px;

}


/* ============================= */
/* Responsive */
/* ============================= */

@media(max-width:700px){

    header h1{

        font-size:22px;

    }

    .container{

        width:95%;

    }

}

</style>

</head>


<body>


<!-- ============================= -->
<!-- Header -->
<!-- ============================= -->

<header>

<h1>
📢 لوحة تحكم الإعلانات
</h1>

<p>
نظام إدارة شاشة الإعلانات الإلكترونية
</p>

</header>



<div class="container">


<!-- ============================= -->
<!-- إضافة إعلان -->
<!-- ============================= -->

<div class="card">

<h2>
➕ إضافة إعلان جديد
</h2>


<div class="form-group">

<label>

عنوان الإعلان

</label>

<input

type="text"

id="title"

placeholder="مثال: إعلان تجديد القيد"

>

</div>



<div class="form-group">

<label>

نص الإعلان

</label>

<textarea

id="description"

placeholder="اكتب تفاصيل الإعلان هنا..."

></textarea>

</div>



<div class="form-group">

<label>

رابط الصورة

</label>

<input

type="text"

id="image"

placeholder="https://example.com/image.jpg"

>

</div>



<div class="form-group">

<label>

مدة العرض بالثواني

</label>

<input

type="number"

id="duration"

value="5"

min="1"

>

</div>



<div class="form-group">

<label>

اختر لون الإعلان

</label>


<div class="colors">


<div

class="color-option"

style="background:#3498db"

onclick="selectColor('#3498db')"

></div>


<div

class="color-option"

style="background:#e74c3c"

onclick="selectColor('#e74c3c')"

></div>


<div

class="color-option"

style="background:#27ae60"

onclick="selectColor('#27ae60')"

></div>


<div

class="color-option"

style="background:#f39c12"

onclick="selectColor('#f39c12')"

></div>


<div

class="color-option"

style="background:#8e44ad"

onclick="selectColor('#8e44ad')"

></div>


</div>

</div>



<div class="buttons">


<button

class="btn-preview"

onclick="previewAnnouncement()"

>

👀 معاينة الإعلان

</button>


<button

class="btn-save"

onclick="saveAnnouncement()"

>

💾 نشر الإعلان

</button>


</div>


<!-- ============================= -->
<!-- Preview -->
<!-- ============================= -->

<div

class="preview"

id="preview"

>

ستظهر معاينة الإعلان هنا

</div>


</div>



<!-- ============================= -->
<!-- قائمة الإعلانات -->
<!-- ============================= -->

<div class="card">

<h2>

📋 الإعلانات الحالية

</h2>


<div

id="slidesList"

>

جاري تحميل الإعلانات...

</div>


</div>



</div>



<script>


/* ============================= */
/* Firebase Config */
/* ============================= */

const firebaseConfig = {

apiKey: "AIzaSyDYsaP3zW2dPnljUWZE8TVIDHiphQgdDA8",

authDomain: "college-signage.firebaseapp.com",

databaseURL:
"https://college-signage-default-rtdb.europe-west1.firebasedatabase.app",

projectId:
"college-signage",

storageBucket:
"college-signage.firebasestorage.app",

messagingSenderId:
"820215192692",

appId:
"1:820215192692:web:f76ca9d22d3e2221098521"

};


/* ============================= */
/* Firebase Start */
/* ============================= */

firebase.initializeApp(firebaseConfig);


const db = firebase.database();


const slidesRef =

db.ref("content/slides");


/* ============================= */
/* اللون الحالي */
/* ============================= */

let selectedColor =

"#3498db";


function selectColor(color){

selectedColor = color;

}


/* ============================= */
/* إنشاء HTML الإعلان */
/* ============================= */

function generateAnnouncementHTML(){


const title =

document.getElementById("title").value;


const description =

document.getElementById("description").value;


const image =

document.getElementById("image").value;



return `

<div

style="

width:100vw;

height:100vh;

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

text-align:center;

background:

linear-gradient(

135deg,

${selectedColor},

#111

);

color:white;

padding:50px;

box-sizing:border-box;

"

>


<h1

style="

font-size:60px;

margin-bottom:30px;

"

>

${title}

</h1>


${
image
?

`

<img

src="${image}"

style="

max-width:70%;

max-height:40vh;

border-radius:15px;

margin-bottom:30px;

"

>

`

:

""

}


<p

style="

font-size:32px;

max-width:1000px;

line-height:1.8;

"

>

${description}

</p>


</div>

`;


}


/* ============================= */
/* معاينة الإعلان */
/* ============================= */

function previewAnnouncement(){


const html =

generateAnnouncementHTML();


document.getElementById(

"preview"

).innerHTML = html;


}


/* ============================= */
/* حفظ الإعلان */
/* ============================= */

function saveAnnouncement(){


const title =

document.getElementById(

"title"

).value.trim();


const description =

document.getElementById(

"description"

).value.trim();


const duration =

Number(

document.getElementById(

"duration"

).value

);


if(!title){

alert(

"يرجى كتابة عنوان الإعلان"

);

return;

}


if(!description){

alert(

"يرجى كتابة نص الإعلان"

);

return;

}


const html =

generateAnnouncementHTML();


/* الحصول على الإعلانات الحالية */

slidesRef.once(

"value"

).then(

snapshot => {


const slides =

snapshot.val() || {};


const keys =

Object.keys(slides);


const newIndex =

keys.length;


slides[newIndex] = {

html:html,

duration:

duration * 1000

};


/* حفظ */

slidesRef.set(

slides

).then(

()=>{


alert(

"تم نشر الإعلان بنجاح 🎉"

);


/* تفريغ الحقول */

document.getElementById(

"title"

).value = "";


document.getElementById(

"description"

).value = "";


document.getElementById(

"image"

).value = "";


document.getElementById(

"preview"

).innerHTML =

"ستظهر معاينة الإعلان هنا";


}

);


}

);


}


/* ============================= */
/* تحميل الإعلانات */
/* ============================= */

slidesRef.on(

"value",

snapshot => {


const slides =

snapshot.val();


const container =

document.getElementById(

"slidesList"

);


container.innerHTML = "";


if(!slides){


container.innerHTML =

"لا توجد إعلانات";


return;

}


Object.keys(

slides

).forEach(

key => {


const slide =

slides[key];


const div =

document.createElement(

"div"

);


div.className =

"slide-item";


div.innerHTML =

`

<span>

إعلان رقم

${Number(key)+1}

</span>


<button

class="btn-delete"

onclick="deleteSlide(${key})"

>

🗑️ حذف

</button>

`;


container.appendChild(

div

);


}

);


}

);


/* ============================= */
/* حذف إعلان */
/* ============================= */

function deleteSlide(index){


if(

!confirm(

"هل تريد حذف هذا الإعلان؟"

)

)

return;


slidesRef.child(

index

).remove();


}


</script>


</body>

</html>
```
