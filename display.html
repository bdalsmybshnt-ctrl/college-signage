<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شاشة العرض</title>

<!-- استدعاء خطوط Google Fonts الاحترافية (Reem Kufi و Tajawal) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #000;
    color: #fff;
    /* تعيين خط Tajawal كخط افتراضي عام للشاشة */
    font-family: 'Tajawal', Arial, sans-serif;
  }

  /* تظهر فقط إذا ما في محتوى منشور بعد */
  #placeholder{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    color:#666;
    letter-spacing:1px;
    font-family: 'Tajawal', sans-serif;
  }

  #content{
    width:100%;
    height:100%;
    display:none;
  }

  /* مؤشر اتصال صغير بالركن */
  #conn{
    position:fixed;
    bottom:10px;
    left:10px;
    width:9px;
    height:9px;
    border-radius:50%;
    background:#8a2f22;
    z-index:9999;
    opacity:0.6;
  }
  #conn.ok{ background:#2f5233; }
</style>
</head>
<body>

<div id="conn"></div>

<div id="placeholder">جاري الاتصال بشاشة العرض…</div>
<div id="content"></div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDYsaP3zW2dPnljUWZE8TVIDHiphQgdDA8",
    authDomain: "college-signage.firebaseapp.com",
    databaseURL: "https://college-signage-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "college-signage",
    storageBucket: "college-signage.firebasestorage.app",
    messagingSenderId: "820215192692",
    appId: "1:820215192692:web:f76ca9d22d3e2221098521"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const contentRef = db.ref('content/html');

  const placeholder = document.getElementById('placeholder');
  const contentEl = document.getElementById('content');
  const connDot = document.getElementById('conn');

  // مؤشر حالة الاتصال بالسيرفر
  db.ref('.info/connected').on('value', (snap) => {
    connDot.classList.toggle('ok', snap.val() === true);
  });

  // الاستماع اللحظي لأي تحديث ينشره الأدمن
  contentRef.on('value', (snap) => {
    const html = snap.val();

    if (!html || !html.trim()) {
      placeholder.style.display = 'flex';
      placeholder.textContent = 'لا يوجد إعلان منشور حاليًا';
      contentEl.style.display = 'none';
      contentEl.innerHTML = '';
      return;
    }

    placeholder.style.display = 'none';
    contentEl.style.display = 'block';
    contentEl.innerHTML = html;
  });

  contentRef.on('error', () => {
    connDot.classList.remove('ok');
  });
</script>

</body>
</html>
