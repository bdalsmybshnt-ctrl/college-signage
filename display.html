
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>شاشة العرض</title>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

    <!-- حماية HTML -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;

            font-family: Arial, sans-serif;
        }


        #stage {

            position: relative;

            width: 100vw;
            height: 100vh;
        }


        .slide {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            display: flex;

            justify-content: center;
            align-items: center;

            opacity: 0;

            transition: opacity 0.6s ease;

            pointer-events: none;
        }


        .slide.active {

            opacity: 1;
        }


        #empty {

            color: white;

            font-size: 30px;

            text-align: center;
        }


        #connection {

            position: fixed;

            bottom: 10px;
            left: 10px;

            background: rgba(0,0,0,0.7);

            color: red;

            padding: 8px 12px;

            font-size: 14px;

            display: none;

            z-index: 9999;
        }


        #connection.show {

            display: block;
        }

    </style>

</head>
<script>
setInterval(function () {
    console.log("المؤقت يعمل كل 4 ثواني");
}, 4000);
</script>

<body>


<div id="stage">

    <div id="slide1" class="slide active"></div>

    <div id="slide2" class="slide"></div>

</div>


<div id="connection">
    ⚠ لا يوجد اتصال
</div>


<script>


/* =========================================
   إعداد Firebase
========================================= */

const firebaseConfig = {

    apiKey: "AIzaSyDYsaP3zW2dPnljUWZE8TVIDHiphQgdDA8",

    authDomain: "college-signage.firebaseapp.com",

    databaseURL:
    "https://college-signage-default-rtdb.europe-west1.firebasedatabase.app",

    projectId: "college-signage",

    storageBucket:
    "college-signage.firebasestorage.app",

    messagingSenderId: "820215192692",

    appId:
    "1:820215192692:web:f76ca9d22d3e2221098521"
};


/* تشغيل Firebase */

firebase.initializeApp(firebaseConfig);

const db = firebase.database();


/* =========================================
   المتغيرات
========================================= */

let slides = [];

let currentSlide = 0;

let timer = null;

let activeLayer = 0;


/* الحصول على الطبقات */

const layers = [

    document.getElementById("slide1"),

    document.getElementById("slide2")

];


/* =========================================
   تنظيف HTML
========================================= */

function cleanHTML(html) {

    if (typeof DOMPurify === "undefined") {

        return "";

    }

    return DOMPurify.sanitize(html);

}


/* =========================================
   عرض صفحة
========================================= */

function showSlide(index) {

    if (slides.length === 0) {

        return;
    }


    const nextLayer = 1 - activeLayer;

    const oldLayer = activeLayer;


    layers[nextLayer].innerHTML =
        cleanHTML(slides[index].html);


    layers[nextLayer].classList.add("active");

    layers[oldLayer].classList.remove("active");


    activeLayer = nextLayer;


    console.log(
        "عرض الصفحة:",
        index + 1,
        "من",
        slides.length
    );
}


/* =========================================
   الانتقال للصفحة التالية
========================================= */

function nextSlide() {

    if (slides.length <= 1) {

        return;
    }


    currentSlide++;


    if (currentSlide >= slides.length) {

        currentSlide = 0;
    }


    showSlide(currentSlide);


    /* تشغيل المؤقت من جديد */

    timer = setTimeout(
        nextSlide,
        4000
    );
}


/* =========================================
   بدء العرض
========================================= */

function startSlideshow() {

    /* إلغاء المؤقت القديم */

    if (timer !== null) {

        clearTimeout(timer);

        timer = null;
    }


    if (slides.length === 0) {

        layers[0].innerHTML =
            '<div id="empty">جاري انتظار المحتوى...</div>';

        layers[0].classList.add("active");

        layers[1].classList.remove("active");

        return;
    }


    /* نبدأ من الصفحة الأولى */

    currentSlide = 0;

    activeLayer = 0;


    layers[0].innerHTML =
        cleanHTML(slides[0].html);


    layers[0].classList.add("active");

    layers[1].classList.remove("active");


    console.log(
        "تم تشغيل العرض.",
        "عدد الصفحات:",
        slides.length
    );


    /* بعد 4 ثوانٍ انتقل */

    timer = setTimeout(
        nextSlide,
        4000
    );
}


/* =========================================
   قراءة الصفحات من Firebase
========================================= */

const slidesRef =
    db.ref("content/slides");


slidesRef.on("value", function(snapshot) {

    const data = snapshot.val();


    if (!data) {

        slides = [];

        startSlideshow();

        return;
    }


    slides = Object.keys(data)

        .sort(function(a, b) {

            return Number(a) - Number(b);

        })

        .map(function(key) {

            return data[key];

        })

        .filter(function(slide) {

            return slide &&
                   typeof slide.html === "string" &&
                   slide.html.trim() !== "";

        });


    console.log(
        "Firebase أرسل:",
        slides.length,
        "صفحات"
    );


    startSlideshow();

});


/* =========================================
   مراقبة الاتصال
========================================= */

db.ref(".info/connected").on(
    "value",
    function(snapshot) {

        const connection =
            document.getElementById("connection");


        if (snapshot.val() === true) {

            connection.classList.remove("show");

        }
        else {

            connection.classList.add("show");

        }

    }
);


/* =========================================
   منع التفاعل
========================================= */

document.addEventListener(
    "contextmenu",
    function(event) {

        event.preventDefault();

    }
);


document.addEventListener(
    "touchmove",
    function(event) {

        event.preventDefault();

    },
    {
        passive: false
    }
);


</script>


</body>

</html>
