```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>شاشة العرض</title>


    <!-- =========================================
         Firebase
    ========================================== -->

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


    <!-- حماية HTML -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;

            font-family: Arial, sans-serif;
        }


        #stage {

            position: relative;

            width: 100vw;
            height: 100vh;
        }


        .slide {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            display: flex;

            justify-content: center;
            align-items: center;

            opacity: 0;

            transition: opacity 0.6s ease;

            pointer-events: none;
        }


        .slide.active {

            opacity: 1;
        }


        #empty {

            color: white;

            font-size: 30px;

            text-align: center;

            padding: 30px;
        }


        /* =========================================
           حالة الاتصال
        ========================================== */

        #connection {

            position: fixed;

            bottom: 10px;
            left: 10px;

            background: rgba(0, 0, 0, 0.8);

            color: white;

            padding: 8px 14px;

            font-size: 14px;

            border-radius: 5px;

            display: none;

            z-index: 9999;
        }


        #connection.show {

            display: block;
        }


        #connection.error {

            color: #ff4444;
        }


        #connection.loading {

            color: #ffff00;
        }


        #connection.success {

            color: #00ff66;
        }

    </style>

</head>


<body>


<div id="stage">

    <div id="slide1" class="slide active"></div>

    <div id="slide2" class="slide"></div>

</div>


<div id="connection">
    جارٍ الاتصال...
</div>


<script>


/* =====================================================
   Firebase Configuration
===================================================== */

const firebaseConfig = {

    apiKey: "AIzaSyDYsaP3zW2dPnljUWZE8TVIDHiphQgdDA8",

    authDomain:
        "college-signage.firebaseapp.com",

    databaseURL:
        "https://college-signage-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "college-signage",

    storageBucket:
        "college-signage.firebasestorage.app",

    messagingSenderId:
        "820215192692",

    appId:
        "1:820215192692:web:f76ca9d22d3e2221098521"
};


/* =====================================================
   المتغيرات
===================================================== */

let slides = [];

let currentSlide = 0;

let timer = null;

let activeLayer = 0;

let firstConnection = true;


/* =====================================================
   عناصر الصفحة
===================================================== */

const layers = [

    document.getElementById("slide1"),

    document.getElementById("slide2")

];


const connection =
    document.getElementById("connection");


/* =====================================================
   إظهار حالة الاتصال
===================================================== */

function showConnection(message, type) {

    connection.textContent = message;

    connection.className = "";

    connection.classList.add("show");

    if (type) {

        connection.classList.add(type);

    }

}


/* =====================================================
   إخفاء حالة الاتصال
===================================================== */

function hideConnection() {

    connection.className = "";

}


/* =====================================================
   تشغيل Firebase
===================================================== */

let db = null;


try {

    console.log("بدء تشغيل Firebase...");

    firebase.initializeApp(firebaseConfig);

    db = firebase.database();

    console.log("تم تشغيل Firebase بنجاح.");

}
catch (error) {

    console.error(
        "خطأ أثناء تشغيل Firebase:",
        error
    );

    showConnection(
        "خطأ في تشغيل Firebase",
        "error"
    );
}


/* =====================================================
   تنظيف HTML
===================================================== */

function cleanHTML(html) {

    if (typeof DOMPurify === "undefined") {

        console.error(
            "DOMPurify غير محمل."
        );

        return html;
    }


    return DOMPurify.sanitize(html, {

        ADD_TAGS: [
            "iframe",
            "video",
            "audio"
        ],

        ADD_ATTR: [
            "allow",
            "allowfullscreen",
            "frameborder",
            "src",
            "controls",
            "autoplay",
            "muted",
            "loop"
        ]

    });
}


/* =====================================================
   عرض الصفحة
===================================================== */

function showSlide(index) {

    if (slides.length === 0) {

        return;
    }


    const nextLayer =
        1 - activeLayer;


    const oldLayer =
        activeLayer;


    layers[nextLayer].innerHTML =
        cleanHTML(slides[index].html);


    layers[nextLayer].classList.add("active");


    layers[oldLayer].classList.remove("active");


    activeLayer =
        nextLayer;


    console.log(
        "عرض الصفحة:",
        index + 1,
        "من",
        slides.length
    );
}


/* =====================================================
   الانتقال للصفحة التالية
===================================================== */

function nextSlide() {

    if (slides.length <= 1) {

        return;
    }


    currentSlide++;


    if (currentSlide >= slides.length) {

        currentSlide = 0;
    }


    showSlide(currentSlide);


    timer = setTimeout(
        nextSlide,
        4000
    );
}


/* =====================================================
   بدء العرض
===================================================== */

function startSlideshow() {

    /* إلغاء المؤقت القديم */

    if (timer !== null) {

        clearTimeout(timer);

        timer = null;
    }


    /* لا يوجد محتوى */

    if (slides.length === 0) {

        layers[0].innerHTML =
            '<div id="empty">جاري انتظار المحتوى...</div>';

        layers[0].classList.add("active");

        layers[1].classList.remove("active");

        return;
    }


    /* البداية */

    currentSlide = 0;

    activeLayer = 0;


    layers[0].innerHTML =
        cleanHTML(slides[0].html);


    layers[0].classList.add("active");

    layers[1].classList.remove("active");


    console.log(
        "تم تشغيل العرض.",
        "عدد الصفحات:",
        slides.length
    );


    /* إذا كانت هناك صفحة واحدة فقط */

    if (slides.length <= 1) {

        return;
    }


    /* تشغيل المؤقت */

    timer = setTimeout(
        nextSlide,
        4000
    );
}


/* =====================================================
   قراءة المحتوى من Firebase
===================================================== */

if (db) {


    const slidesRef =
        db.ref("content/slides");


    console.log(
        "جارٍ الاتصال بالمسار:",
        "content/slides"
    );


    slidesRef.on(

        "value",

        function(snapshot) {

            console.log(
                "وصلت بيانات من Firebase."
            );


            const data =
                snapshot.val();


            /* لا يوجد محتوى */

            if (!data) {

                console.log(
                    "لا يوجد محتوى في content/slides"
                );


                slides = [];

                startSlideshow();

                return;
            }


            /* تحويل البيانات إلى مصفوفة */

            slides = Object.keys(data)

                .sort(function(a, b) {

                    return Number(a) - Number(b);

                })

                .map(function(key) {

                    return data[key];

                })

                .filter(function(slide) {

                    return (

                        slide &&

                        typeof slide.html === "string" &&

                        slide.html.trim() !== ""

                    );

                });


            console.log(
                "Firebase أرسل:",
                slides.length,
                "صفحات"
            );


            /* تشغيل العرض */

            startSlideshow();

        },


        function(error) {

            console.error(
                "خطأ في قراءة Firebase:",
                error
            );


            showConnection(
                "خطأ في قراءة المحتوى",
                "error"
            );

        }

    );


    /* =================================================
       مراقبة الاتصال
    ================================================= */

    db.ref(".info/connected").on(

        "value",

        function(snapshot) {

            const connected =
                snapshot.val() === true;


            console.log(
                "حالة Firebase:",
                connected
                    ? "متصل"
                    : "غير متصل"
            );


            if (connected) {

                hideConnection();

                firstConnection = false;

            }
            else {

                if (firstConnection) {

                    showConnection(
                        "جارٍ الاتصال بـ Firebase...",
                        "loading"
                    );

                }
                else {

                    showConnection(
                        "⚠ لا يوجد اتصال",
                        "error"
                    );

                }

            }

        }

    );

}


/* =====================================================
   اختبار الاتصال كل 10 ثواني
===================================================== */

setInterval(function() {

    if (db) {

        console.log(
            "اختبار الاتصال بـ Firebase..."
        );

        db.goOnline();

    }

}, 10000);


/* =====================================================
   منع القائمة بزر الفأرة
===================================================== */

document.addEventListener(

    "contextmenu",

    function(event) {

        event.preventDefault();

    }

);


/* =====================================================
   منع تحريك الصفحة باللمس
===================================================== */

document.addEventListener(

    "touchmove",

    function(event) {

        event.preventDefault();

    },

    {
        passive: false
    }

);


/* =====================================================
   اختبار المؤقت
===================================================== */

setInterval(function() {

    console.log(
        "المؤقت يعمل..."
    );

}, 4000);


</script>


</body>

</html>
